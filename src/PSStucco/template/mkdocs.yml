site_name: "<%=$PLASTER_PARAM_MkDocsSiteName%> Documentation"
site_description: "<%=$PLASTER_PARAM_Description%>"
site_author: "<%=$PLASTER_PARAM_FullName%>"
site_url: "<%=$PLASTER_PARAM_MkDocsGitRepoUrl%>/"

repo_name: "<%=$PLASTER_PARAM_GitHubUserName%>/<%=$PLASTER_PARAM_ModuleName%>"
repo_url: "<%=$PLASTER_PARAM_MkDocsGitRepoUrl%>"
edit_uri: "edit/main/docs/"

theme:
  name: material
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/powershell
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<%=$PLASTER_PARAM_GitHubUserName%>
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:materialx.emoji.to_svg
      emoji_index: !!python/name:materialx.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: <%=$PLASTER_PARAM_GitHubUserName%>
      repo: <%=$PLASTER_PARAM_ModuleName%>
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - mermaid2:
      arguments:
        theme: base
        themeVariables:
          primaryColor: '#2196F3'
          primaryTextColor: '#FFFFFF'
          primaryBorderColor: '#1976D2'
  - git-revision-date-localized:
      enable_creation_date: true

nav:
  - Home:
    - Overview: index.md
    - Installation: installation.md
    - Quick Start: quickstart.md
  - Documentation:
    - User Guide: userguide.md
    - API Reference: api/
    - Examples: examples.md
  - Development:
    - Contributing: contributing.md
    - Development Setup: development.md
    - Testing: testing.md
    - Release Process: release.md
  - About:
    - License: license.md
    - Changelog: changelog.md
    - Support: support.md

watch:
  - docs/
  - src/
